<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NÍVEL MVP</title>
<style>
body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b}
header{background:#123b5d;color:#fff;text-align:center;padding:24px 16px}
h1{margin:0;font-size:30px} header p{margin:6px 0 0}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
input{width:100%;padding:14px;border:1px solid #ccd4db;border-radius:10px;font-size:16px;margin:8px 0 15px;box-sizing:border-box}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#123b5d;color:white;font-size:17px;font-weight:700;margin-top:8px}
.option{background:#f7f9fa;color:#17212b;border:2px solid #dfe5e9;text-align:left}
.option.selected{background:#e8f3fa;border-color:#2d7db3}
.hidden{display:none!important}
.small{color:#65717c;font-size:14px}
.progress{height:8px;background:#e2e7eb;border-radius:8px;margin:12px 0 20px}
#bar{height:100%;width:0;background:#2d7db3;border-radius:8px}
.question{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:12px}
.result{padding:13px;background:#f5f7f8;border-radius:10px;margin:8px 0}
.red{border-left:5px solid #d64a4a}.yellow{border-left:5px solid #d89b21}.green{border-left:5px solid #2e9d62}
</style>
</head>
<body>
<header><h1>NÍVEL</h1><p>Diagnóstico de aprendizagem — 4.ª Classe</p></header>

<main>
<div id="inicio" class="card">
<h2>Começar diagnóstico</h2>
<p class="small">Versão MVP 0.2</p>
<label>Nome do aluno</label>
<input id="nome" type="text" placeholder="Ex.: João Manuel">
<label>Nome da escola</label>
<input id="escola" type="text" placeholder="Ex.: Colégio ABC">
<button type="button" id="btnComecar">COMEÇAR</button>
</div>

<div id="teste" class="card hidden">
<div id="contador" class="small"></div>
<div class="progress"><div id="bar"></div></div>
<div id="pergunta"></div>
<div id="opcoes"></div>
<button type="button" id="btnSeguinte" disabled>SEGUINTE</button>
</div>

<div id="resultado" class="hidden">
<div class="card"><h2 id="tituloResultado"></h2><p id="resumo"></p></div>
<div class="card"><h2>Mapa de aprendizagem</h2><div id="mapa"></div></div>
<div class="card"><h2>Prioridades</h2><ol id="prioridades"></ol></div>
<div class="card"><button type="button" onclick="location.reload()">NOVO DIAGNÓSTICO</button></div>
</div>
</main>

<script>
(function(){
const Q=[
["Português","Leitura e compreensão","Onde ficava a horta?",["Na casa de Ana","Na escola de Ana","No mercado","Num parque"],1],
["Português","Leitura e compreensão","Em que dia os alunos cuidavam da horta?",["Segunda-feira","Quarta-feira","Sexta-feira","Domingo"],2],
["Português","Leitura e compreensão","O que alguns alunos faziam?",["Pintavam a escola","Regavam as hortaliças","Vendiam sementes","Limpavam as salas"],1],
["Português","Leitura e compreensão","O que a professora levou?",["Flores","Árvores","Sementes de tomate","Frutas"],2],
["Português","Leitura e compreensão","Qual era a responsabilidade de Ana?",["Preparar o almoço","Regar as sementes","Vender os tomates","Limpar a sala"],1],
["Português","Leitura e compreensão","Porque ficou a turma contente?",["Porque terminou a escola","Porque apareceram os primeiros tomates","Porque receberam livros","Porque começaram as férias"],1],
["Português","Leitura e compreensão","O que podemos concluir sobre Ana?",["Não gostava da horta.","Cuidava das sementes com atenção.","Não queria ajudar os colegas.","Nunca ia à escola."],1],
["Português","Leitura e compreensão","Qual é a ideia principal do texto?",["Uma turma cuidou de uma horta escolar.","Ana deixou de frequentar a escola.","A professora vendeu tomates.","Os alunos foram visitar um mercado."],0],
["Português","Vocabulário","“Hortaliças” refere-se a:",["Brinquedos","Plantas cultivadas para alimentação","Ferramentas","Animais"],1],
["Português","Vocabulário","Qual é o contrário de “pequena”?",["Curta","Grande","Baixa","Fina"],1],
["Português","Vocabulário","Qual palavra significa aproximadamente o mesmo que “contente”?",["Feliz","Cansado","Triste","Preocupado"],0],
["Português","Vocabulário","“Ana cuidou das sementes com atenção”. Atenção indica:",["Descuido","Cuidado","Pressa","Medo"],1],
["Português","Gramática","Qual é o plural de “planta”?",["Plantas","Plantas-es","Plantã","Plantões"],0],
["Português","Gramática","Na frase “Os alunos cuidaram da horta”, quem praticou a acção?",["A horta","Os alunos","A professora","Ana"],1],
["Português","Gramática","Qual é o verbo em “Ana regou as sementes”?",["Ana","Regou","Sementes","As"],1],
["Português","Gramática","Qual frase está correctamente escrita?",["Os aluno cuidou da horta.","Os alunos cuidaram da horta.","Os alunos cuidou da horta.","O alunos cuidaram da horta."],1],
["Português","Gramática","Qual destas palavras é um adjectivo?",["Escola","Cuidar","Pequena","Alunos"],2],
["Português","Escrita","Qual frase melhor descreve uma actividade escolar?",["A escola é.","Eu gosto de estudar e aprender coisas novas.","Livro mesa.","Ontem."],1],
["Português","Escrita","Qual frase está mais completa?",["Horta.","Os alunos cuidam da horta todas as sextas-feiras.","Alunos horta sexta.","Cuidar."],1],
["Português","Escrita","Qual opção apresenta ideias mais claras?",["Estudei. Depois fiz o teste. Fiquei contente.","Teste contente depois.","Estudei teste.","Depois."],0],
["Matemática","Números e operações","Qual é o maior número?",["3 245","3 425","3 254","3 245"],1],
["Matemática","Números e operações","Qual é o valor do algarismo 7 em 4 725?",["7","70","700","7 000"],2],
["Matemática","Números e operações","247 + 135 = ?",["372","382","392","402"],1],
["Matemática","Números e operações","600 − 275 = ?",["315","325","335","345"],1],
["Matemática","Números e operações","Qual número vem depois de 9 999?",["9 990","10 000","10 009","11 000"],1],
["Matemática","Números e operações","4 × 6 = ?",["20","24","26","28"],1],
["Matemática","Números e operações","48 ÷ 6 = ?",["6","7","8","9"],2],
["Matemática","Números e operações","Qual expressão tem o maior resultado?",["20 + 10","5 × 7","50 − 15","40 ÷ 2"],2],
["Matemática","Multiplicação e divisão","23 × 4 = ?",["82","92","96","102"],1],
["Matemática","Multiplicação e divisão","125 × 3 = ?",["325","350","375","425"],2],
["Matemática","Multiplicação e divisão","84 ÷ 7 = ?",["10","11","12","14"],2],
["Matemática","Multiplicação e divisão","144 ÷ 12 = ?",["10","11","12","14"],2],
["Matemática","Multiplicação e divisão","24 caixas têm 15 livros cada. Quantos livros?",["240","300","360","390"],2],
["Matemática","Resolução de problemas","Maria tinha 500 Kz e gastou 175 Kz. Quanto restou?",["275 Kz","300 Kz","325 Kz","375 Kz"],2],
["Matemática","Resolução de problemas","32 alunos foram divididos igualmente por 4 grupos. Quantos em cada grupo?",["6","7","8","9"],2],
["Matemática","Resolução de problemas","8 filas têm 12 árvores cada. Quantas árvores?",["86","92","96","108"],2],
["Matemática","Resolução de problemas","750 cadernos + 250 − 300 = ?",["600","650","700","800"],2],
["Matemática","Geometria e medidas","Quantos lados tem um quadrado?",["3","4","5","6"],1],
["Matemática","Geometria e medidas","8h00 até 10h00: quanto tempo?",["1 hora","2 horas","3 horas","4 horas"],1],
["Matemática","Geometria e medidas","1 litro corresponde a quantos mililitros?",["10 ml","100 ml","500 ml","1 000 ml"],3]
];

let i=0, respostas=[];
const $=id=>document.getElementById(id);

$("btnComecar").onclick=function(){
  const nome=$("nome").value.trim();
  if(!nome){alert("Escreve primeiro o nome do aluno.");$("nome").focus();return;}
  $("inicio").classList.add("hidden");
  $("teste").classList.remove("hidden");
  mostrar();
};

function mostrar(){
 const q=Q[i];
 $("contador").textContent="Questão "+(i+1)+" de "+Q.length+" · "+q[0]+" · "+q[1];
 $("bar").style.width=((i/Q.length)*100)+"%";
 $("pergunta").innerHTML='<div class="question">'+q[2]+'</div>';
 $("opcoes").innerHTML="";
 q[3].forEach((op,n)=>{
   const b=document.createElement("button");
   b.type="button"; b.className="option";
   b.textContent=String.fromCharCode(65+n)+") "+op;
   b.onclick=function(){
     respostas[i]=n;
     document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
     b.classList.add("selected");
     $("btnSeguinte").disabled=false;
   };
   $("opcoes").appendChild(b);
 });
 $("btnSeguinte").disabled=true;
 $("btnSeguinte").textContent=i===Q.length-1?"VER RESULTADO":"SEGUINTE";
}

$("btnSeguinte").onclick=function(){
 if(respostas[i]===undefined)return;
 i++;
 if(i<Q.length)mostrar(); else finalizar();
};

function finalizar(){
 $("teste").classList.add("hidden");
 $("resultado").classList.remove("hidden");
 const nome=$("nome").value.trim();
 const escola=$("escola").value.trim();
 $("tituloResultado").textContent="Resultado — "+nome;
 $("resumo").textContent=(escola?escola+" · ":"")+"Diagnóstico concluído.";
 const s={};
 Q.forEach((q,n)=>{
   const c=q[1];
   if(!s[c])s[c]={d:q[0],total:0,certas:0};
   s[c].total++;
   if(respostas[n]===q[4])s[c].certas++;
 });
 const lista=Object.keys(s).map(c=>{
   const pct=Math.round(s[c].certas/s[c].total*100);
   return {c:c,pct:pct,d:s[c].d,certas:s[c].certas,total:s[c].total};
 });
 $("mapa").innerHTML="";
 lista.forEach(x=>{
   const classe=x.pct>=75?"green":x.pct>=50?"yellow":"red";
   const nome=x.pct>=75?"Domínio":x.pct>=50?"Em desenvolvimento":"Recuperação";
   $("mapa").innerHTML+=`<div class="result ${classe}"><b>${x.c}</b><br>${nome} — ${x.pct}% (${x.certas}/${x.total})</div>`;
 });
 $("prioridades").innerHTML="";
 lista.filter(x=>x.pct<75).sort((a,b)=>a.pct-b.pct).slice(0,4).forEach(x=>{
   $("prioridades").innerHTML+=`<li><b>${x.c}</b> — ${x.pct}%</li>`;
 });
 if(!$("prioridades").children.length)$("prioridades").innerHTML="<li>Nenhuma prioridade identificada neste protótipo.</li>";
}
})();
</script>
</body>
</html>
